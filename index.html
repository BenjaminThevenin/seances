<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Séances</title>
  <meta name="theme-color" content="#0d0f12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Séances">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Chrono</h1>
    <button class="icon-btn" data-action="open-settings" aria-label="Réglages">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <main id="view"></main>

  <nav class="tabbar">
    <button class="tab active" data-action="tab" data-view="timer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6M12 2v3"/></svg>
      <span>Chrono</span>
    </button>
    <button class="tab" data-action="tab" data-view="exercises">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      <span>Exercices</span>
    </button>
    <button class="tab" data-action="tab" data-view="pushups">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>
      <span>Pompes</span>
    </button>
    <button class="tab" data-action="tab" data-view="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Stats</span>
    </button>
  </nav>

  <!-- Écran de séance en cours -->
  <section id="run" class="run" hidden data-phase="prep">
    <div class="run-top">
      <span id="run-title"></span>
      <span id="run-total"></span>
    </div>
    <div class="run-center" data-action="run-pause">
      <div class="ring-wrap">
        <svg viewBox="0 0 200 200" class="ring">
          <circle class="ring-bg" cx="100" cy="100" r="92"/>
          <circle class="ring-fg" id="ring" cx="100" cy="100" r="92"/>
        </svg>
        <div class="ring-inner">
          <div id="run-phase"></div>
          <div id="run-time">0:00</div>
          <div id="run-round"></div>
        </div>
      </div>
      <div id="run-next"></div>
    </div>
    <div class="run-controls">
      <button class="ctl" data-action="run-stop" aria-label="Arrêter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <button class="ctl" data-action="run-plus" aria-label="Ajouter 10 secondes"><b>+10</b></button>
      <button class="ctl main" data-action="run-pause" aria-label="Pause" id="btn-pause">
        <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        <svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
      </button>
      <button class="ctl" data-action="run-skip" aria-label="Phase suivante">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 5.5v13a1 1 0 0 0 1.5.86L16 13.5V18a1 1 0 0 0 2 0V6a1 1 0 0 0-2 0v4.5L6.5 4.64A1 1 0 0 0 5 5.5z"/></svg>
      </button>
    </div>

    <!-- Saisie des pompes après chaque série -->
    <div id="reps-panel" class="reps-panel" hidden>
      <div class="reps-q" id="reps-q"></div>
      <div class="picker">
        <button class="pk" data-action="reps-adj" data-d="-5">−5</button>
        <button class="pk" data-action="reps-adj" data-d="-1">−1</button>
        <output id="reps-val">10</output>
        <button class="pk" data-action="reps-adj" data-d="1">+1</button>
        <button class="pk" data-action="reps-adj" data-d="5">+5</button>
      </div>
      <div class="btn-row">
        <button class="btn" style="flex:0 0 32%" data-action="reps-skip">Passer</button>
        <button class="btn primary" data-action="reps-ok">Valider</button>
      </div>
    </div>

    <!-- Fin de séance -->
    <div id="run-done" class="run-done" hidden></div>
  </section>

  <!-- Panneau modal générique -->
  <div id="sheet" class="sheet-backdrop" hidden data-action="sheet-backdrop">
    <div class="sheet" id="sheet-body"></div>
  </div>

  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <script src="app.js"></script>
</body>
</html>
